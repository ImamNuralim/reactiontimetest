<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard · reactimetestihsan</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet" />
  </head>
  <body class="app">
    <header class="topbar">
      <a href="../" class="brand"><span class="brand-mark"><i class="ri-pulse-line"></i></span>reactimetestihsan</a>

      <div class="role-switch" role="tablist" aria-label="Pilih peran">
        <button class="role-btn" data-role="admin" role="tab">Admin</button>
        <button class="role-btn" data-role="pekerja" role="tab">Pekerja</button>
      </div>

      <button class="ghost-btn" id="resetBtn" title="Kembalikan data dummy">
        <i class="ri-refresh-line"></i> Reset data
      </button>
    </header>

    <main class="container">
      <!-- ===== ADMIN ===== -->
      <section id="view-admin" class="view" hidden>
        <div class="page-head">
          <h1>Monitoring Kelelahan</h1>
          <p>Pantau hasil tes semua pekerja. Pilih nama untuk melihat preview dan kesimpulan.</p>
        </div>

        <div class="stats" id="stats"></div>

        <div class="admin-grid">
          <div class="card">
            <div class="card-head"><h2>Daftar pekerja</h2></div>
            <div class="table-wrap">
              <table class="table">
                <thead>
                  <tr>
                    <th>Nama</th><th>Divisi</th><th>Shift</th>
                    <th>Tes terakhir</th><th>Rata-rata</th><th>Kategori</th>
                  </tr>
                </thead>
                <tbody id="workerRows"></tbody>
              </table>
            </div>
          </div>

          <aside class="card preview" id="preview"></aside>
        </div>
      </section>

      <!-- ===== PEKERJA ===== -->
      <section id="view-pekerja" class="view" hidden>
        <div class="page-head">
          <h1>Tes Waktu Reaksi</h1>
          <p>Pilih nama Anda, lalu klik area di bawah setiap kali warna berubah hijau.</p>
        </div>

        <div class="pekerja-grid">
          <div class="card">
            <label class="field">
              <span>Saya adalah</span>
              <select id="workerSelect"></select>
            </label>

            <div id="arena" class="arena state-idle">
              <p class="arena-msg" id="msg"></p>
              <p class="arena-note" id="note"></p>
            </div>

            <div class="progress"><div id="bar"></div></div>
            <p class="muted small" id="progressText"></p>
          </div>

          <aside class="card" id="myResult"></aside>
        </div>
      </section>
    </main>

    <!-- Audio hasil tes -->
    <audio id="audio-normal" src="../voice/normal.mp3" preload="auto"></audio>
    <audio id="audio-kelelahan-ringan" src="../voice/ringan.mp3" preload="auto"></audio>
    <audio id="audio-kelelahan-sedang" src="../voice/sedang.mp3" preload="auto"></audio>
    <audio id="audio-kelelahan-berat" src="../voice/berat.mp3" preload="auto"></audio>

    <script src="../js/data.js"></script>
    <script src="../js/dashboard.js"></script>
  </body>
</html>
